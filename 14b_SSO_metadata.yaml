wind_force:
  default:
    unit: "beaufort"
    year_range: {start: 1873, end: 1921}
    exceptions:
      - station: ["Durham"]
        year_range: 1877
        # method: "anemometer"
        # conversion: "'Instructions', table on p. 58" 
        unit: "beaufort"
      # - station: ["Southampton"]
      #   year_range: 1878
        # method: "force is given in pounds per square foot"
        # conversion: "Sir H James' book of Instructions, Table VII"
      - station: ["Deerness", "Glasgow", "Stonyhurst", "Armagh"]
        # year_range: {start: 1897, end: 1905}
        instrument: "Robinson cup anemometer starting in 1897" # of the Standard size and pattern
        # conversion: "Table found in 'Instructions in the Use of Meteorological Instruments' Robert H. Scott, 1875"
        unit: "beaufort"
      - station: ["Braemar", "Dundee", "Wolfelee", "Dunrobin Castle"] # Stations marked S
        year_range: {start: 1897, end: 1905}
        # method: "The scale employed in estimating wind force is known as the Land Scale. Under this scale 0 indicates calm and 6 indicates the strongest wind"
        # written_in_book: "The original entries were multiplied by 2 to make them fairly comparable with observations under Beaufort"
        unit: "beaufort"
      - station: ["Aberdeen", "Falmouth", "Valencia"]
      # ["Aberdeen", "Armagh", "Deerness", "Falmouth", "Glasgow", "Stonyhurst", "Valencia"]
        # year_range: {start: 1906, end: 1907}
        instrument: "Robinson cup anemometer starting in 1906" 
        # written_in_book: "From 1906, the factor 2.2 was used in place of 3.0 in tabulating records of Robinson Cup anemometers of standard pattern and dimensions 9 inch cups and 2 ft arms. Simultaneously a revised scale of velocity equivalents for the Beaufort numbers was adopted. The change was most noticeable in decreasing the number of calms recorded, making the number of calms difficult to compare with previous years. In the 1920 volume, it is noted that with the factor 2.2, winds below 8 m/s were probably underestimated"
        unit: "beaufort"
      - station: ["Armagh", "Dublin Phoenix Park"]
        year_range: {start: 1908, end: 1911}
        unit: "miles per hour"
      - station: ["Armagh"]
        year_range: {start: 1912, end: 1921}
        unit: "m/s"
      - station: ["Dublin Phoenix Park"]
        year_range: 1912
        unit: "m/s"
      - station: ["Dublin Phoenix Park"]
        year_range: {start: 1913, end: 1921}
        unit: "beaufort"
      - station: ["Limerick"]
        year_range: {start: 1911, end: 1912}
        unit: "beaufort"
      - station: ["Deerness"]
        year_range: {start: 1908, end: 1910}
        # instrument: "Robinson cup anemometer"
        anemometer_height_above_msl_ft: 188
        anemometer_height_above_ground_ft: 16
        anemometer_height_above_roof_ft: 5
        anemometer_cups_diameter_in: 9
        anemometer_arms_ft: 2
        anemometer_factor: 2.2
        unit: "miles per hour"
        # written_in_book: "No direction is specified if the velocity is under 4 mph"
