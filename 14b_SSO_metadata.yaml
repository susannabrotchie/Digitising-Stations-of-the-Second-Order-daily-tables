metadata_overrides:
  - station: ["Armagh"]
    year_range: {start: 1885, end: 1918}
    alt_m: 62.2
    hob_m: 63.7
  - station: ["Armagh"] #gemini mixing up the hob (63.7m) and the alt (62.2m)
    year_range: {start: 1919, end: 1921}
    alt_m: 62.2
    hob_m: 63.7
  - station: ["Birmingham"]
    alt_m: 160.0
    hob_m: 165.2
  - station: ["Babbacombe"]
    year_range: 1880
    lat: -3.5167 # 3 deg 31 min E was in logbook when it should have been 3 deg 31 min W 
  - station: ["Birr Castle"] #gemini inconsistently transcribes the minus sign
    hob_ft: -2.0
  - station: ["Birr Castle"] #several red ink corrections in 1886 that Gemini did not pick up on
    year_range: 1886
    alt_m: 175.0
  - station: ["Cambridge"]
    date_range: {start: 1904-01-01, end: 1905-07-31}
    alt_ft: 41.0
    hob_ft: 2.0
    therm_ft: 4
    rain_ft: 1.667 #1 ft 8in
    lon: 0.1333 # 0 deg 8 min E
    lat: 52.2000 # 52 deg 12 min N
  - station: ["Cambridge"] # gemini mixed up alt (should be 12.8m) and hob (should be 13.1m)
    date_range: {start: 1918-08-01, end: 1918-09-30}
    alt_m: 12.8
    hob_m: 13.1
  - station: ["Dublin"]
    year_range: {start: 1886, end: 1921}
    name: "Dublin Phoenix Park"
  - station: ["Dublin"]
    date_range: {start: 1906-01-01, end: 1906-01-31} # gemini mistranscribed hob as 5 should be 4 ft
    hob_ft: 4.0
  - station: ["Durham"]
    date_range: {start: 1877-01-01, end: 180-12-31}
    lat: 54.7667
  - station: ["Carmarthen"]
    alt_ft: 138.0
  - station: ["Churchstoke"] #gemini mistranscribed 538ft as 533ft
    date_range: {start: 1885-12-01, end: 1885-12-31}
    alt_ft: 538.0
  - station: ["Cronkbourne Douglas"] #logbook writes 4˚10’N instead of 54˚10’N September 1918
    date_range: {start: 1918-09-01, end: 1918-09-30}
    lat: 54.1667 # 54 deg 10 min N
  - station: ["Cronkbourne Douglas"] #logbook writes 4˚10’N instead of 54˚10’N September 1918
    date_range: {start: 1908-05-29, end: 1908-05-31}
    lat: 54.1667 # 54 deg 10 min N
    lon: -4.6667 # 4 deg 28 min W
    alt_ft: 277.0
    hob_ft: 7.0
    therm_ft: 4.0
    rain_ft: 0.83 # 10 inches
  - station: ["Deerness"] #makes sure the SEF conversion relays that the station moved on 24 March 1891 rather than on 01 March 1891
    date_range: {start: 1891-03-24, end: 1897-10-15} # Hob oct 1897: 3 ft till 15th then 12ft. Gemini transcribed this information, below makes sure it is relayed into the SEF
    alt_ft: 169.0
    hob_ft: 3.0
    therm_ft: 4.0
    rain_ft: 1.0
    lon: -2.7500 # 2 deg 45 min W
    lat: 58.9333 # 58 deg 56 min N
  - station: ["Deerness"] #makes sure the SEF conversion relays that the station moved on 24 March 1891 rather than on 01 March 1891
    date_range: {start: 1897-10-16, end: 1906-11-30} # Hob oct 1897: 3 ft till 15th then 12ft. Gemini transcribed this information, below makes sure it is relayed into the SEF
    # apr 1900: gemini mistrancribed 12 ft as 2 ft, from dec 1906: hob is written in logbooks as 3ft
    hob_ft: 12.0
  - station: ["Deerness"] # December 1915, gemini mixed up the Hob and altitude. They should be alt=48.8 and hob=49.7
    date_range: {start: 1915-12-01, end: 1915-12-31} 
    alt_m: 48.8
    hob_m: 49.7
  - station: ["Dundee"] # gemini mistrancribed alt 160 ft as 162ft
