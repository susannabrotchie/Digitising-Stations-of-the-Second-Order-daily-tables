global_metadata:
  source: "Brotchie et al. (in prep.)"
  link: ""

hours_of_observation:
  defaults:
    - date_range: {start: 1873-01-01, end: 1874-07-31}
      time_zone: "local time"
      general: ["08:00", "16:00", "00:00"]
      rr: ["08:00"]
      Tn: ["08:00"]
      Tx: ["08:00"]
    - date_range: {start: 1874-09-01, end: 1921-12-31}
    # Front matter of 1874 volume writes:
      # after July 31st 1874 observing hours were changed to 9a/pm
      # but August table still has 3 observing hours for all variables
      time_zone: "local time"
      general: ["09:00", "21:00"]
      rr: ["09:00"]
      Tn: ["21:00"]
      Tx: ["21:00"]
      TGn: ["21:00"] # assumed
  exceptions:
    - station: ["durham"]
      year_range: {start: 1877, end: 1880} #no mention in 1879 volume
      general: ["10:00", "22:00"]
      rr: ["10:00"]
      Tn: ["22:00"]
      Tx: ["22:00"]
    - station: ["oscott"]
      date_range: {start: 1875-01-01, end: 1875-01-31}
      Tn: ["09:00"] 
      Tx: ["09:00"]
    - station: ["southampton"]
      year_range: 1878
      rr: ["09:30"] 
      Tn: ["09:30"] 
      Tx: ["09:30"]
    - station: ["stonyhurst"] 
      year_range: {start: 1887, end: 1896}
      rr: ["10:00"]
    - station: ["laudale"]
      year_range: {start: 1879, end: 1881}
      Tn: ["09:00"]
    - station: ["wolfelee"]
      year_range: {start: 1887, end: 1889}
      Tn: ["09:00"]
      Tx: ["09:00"]
    - station: ["aberdeen", "kew", "falmouth", "braemar", "dundee", "wolfelee", "dunrobin castle"]
    # while fort william and valencia are mentioned in the front matter as part of this list, they are only monthly stations for these year_range
    # as such have not included them here
      year_range: {start: 1897, end: 1898}
      general: ["09:00", "21:00"]
      Tn, Tx: ["22:00"] # NOTE: only for 1897,1898
      cloud: ["10:00","22:00"]
      rr: ["10:00"]
    - station: ["aberdeen", "kew", "falmouth", "braemar", "dundee", "wolfelee", "dunrobin castle"]
      year_range: {start: 1899, end: 1908}
      general: ["09:00", "21:00"]
      cloud: ["10:00","22:00"]
      rr: ["10:00"]
    - station: ["glasgow", "stonyhurst"]
      year_range: {start: 1897, end: 1907}
      rr: ["10:00"]
    - station: ["cronkbourne douglas"]
      date_range: {start: 1921-04-01, end: 1921-05-31}
      general: ["09:00", "17:00"]
      Tn: ["17:00"]
      Tx: ["17:00"]
    - station: ["armagh"]
      year_range: 1919
      general: ["09:00", "21:00"]
      Tn: ["21:00"]
      Tx: ["21:00"]
      rr: ["09:00"]
      TGn: ["21:00"]
    - station: ["armagh"]
      year_range: 1919
      general: ["09:00", "21:00"]
      Tn: ["21:00"]
      Tx: ["21:00"]
      rr: ["09:00"]
      TGn: ["21:00"]
    - station: ["cronkbourne douglas"]
      year_range: 1918
      general: ["09:00", "21:00"]
      Tn: ["21:00"]
      Tx: ["21:00"]
      rr: ["09:00"]
      TGn: ["21:00"]
    - station: ["aberdeen"]
      year_range: 1921
      general: ["09:00", "21:00"]
      Tn: ["00:00"]
      Tx: ["00:00"]
      rr: ["00:00"]
      TGn: ["00:00"]
    - station: ["cambridge"]
      date_range: {start: 1916-05-21, end: 1921-12-31}
      general: ["08:00", "20:00"]
      Tn: ["20:00"]
      Tx: ["20:00"]
      rr: ["08:00"]
      TGn: ["20:00"]

time_zones:
  - stations: "all"
    time_zone: "Local mean time"
    exceptions: ["Aberdeen", "Deerness", "Kew", "Falmouth", "Braemar", "Dundee", "Wolfelee", "Dunrobin Castle", "Tillypronie", "Fort William"]
    exception_time_zone: "GMT"
    year_range: {start: 1897, end: 1913}
  - stations: ["Limerick", "Armagh", "Markree Castle", "Dublin", "Birr Castle"]
    year_range: {start: 1911, end: 1916}
    time_zone: "Dublin Mean Time"
  - stations: ["Armagh", "Dublin"]
    year_range: {start: 1917, end: 1921}
    time_zone: "Local mean time"
  - stations: ["Glasgow", "Cockle Park", "Cronkbourne Douglas", "Birmingham", "Stonyhurst", "Shrewsbury", "Southampton"]
    time_zone: "Local mean time"
    year_range: {start: 1917, end: 1921}
  - stations: ["Cambridge"]
    year_range: {start: 1911, end: 1916}
    time_zone: "Local mean time"
  - stations: ["Cambridge"]
    year_range: {start: 1917, end: 1921}
    time_zone: "GMT"

